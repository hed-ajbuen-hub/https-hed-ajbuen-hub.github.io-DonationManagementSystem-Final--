<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaigns - Donation Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="campaigns">

    <header class="navbar">
        <h2>Donation Management System</h2>
        <nav>
            <a href="index.html">Donors</a>
            <a href="Campaigns.html" class="active">Campaigns</a>
            <a href="donations.html">Donations</a>
            <a href="beneficiaries.html">Beneficiaries</a>
        </nav>
        <div class="session-controls" data-session-controls></div>
    </header>

    <div class="container">
        <!-- Form Section -->
        <div class="card" data-admin-only>
            <h3>Create Campaign</h3>
            <form id="record-form">
                <div class="form-group">
                    <label for="title">Campaign Title</label>
                    <input type="text" id="title" name="title" placeholder="e.g. Typhoon Relief Fund" required>
                </div>

                <div class="form-group">
                    <label for="targetAmount">Target Amount (PHP)</label>
                    <input type="number" id="targetAmount" name="targetAmount" placeholder="e.g. 50000" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="Active">Active</option>
                        <option value="Pending">Pending</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3" placeholder="Brief description of the cause"></textarea>
                </div>

                <button type="submit" class="btn">Save Campaign</button>
            </form>
        </div>

        <!-- Table Section -->
        <div class="card">
            <h3>Active Campaigns</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Campaign Title</th>
                        <th>Target Amount</th>
                        <th>Current Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="records-table"></tbody>
            </table>
        </div>
    </div>

    <script src="api-config.js"></script>
    <script src="app.js" defer></script>
</body>
</html>
