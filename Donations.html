<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donations - Donation Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="donations">

    <header class="navbar">
        <h2>Donation Management System</h2>
        <nav>
            <a href="index.html">Donors</a>
            <a href="Campaigns.html">Campaigns</a>
            <a href="donations.html" class="active">Donations</a>
            <a href="beneficiaries.html">Beneficiaries</a>
        </nav>
        <div class="session-controls" data-session-controls></div>
    </header>

    <div class="container">
        <!-- Form Section -->
        <div class="card">
            <h3>Record New Donation</h3>
            <form id="record-form">
                <div class="form-group">
                    <label for="donationNumber">Donation Number</label>
                    <input type="text" id="donationNumber" name="donationNumber" placeholder="e.g. DON-2026-001" required>
                </div>

                <div class="form-group">
                    <label for="donorId">Donor Name</label>
                    <select id="donorId" name="donorId" required>
                        <option value="">Select a donor</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="campaignId">Campaign</label>
                    <select id="campaignId" name="campaignId" required>
                        <option value="">Select a campaign</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (PHP)</label>
                    <input type="number" id="amount" name="amount" placeholder="e.g. 1000.00" step="0.01" required>
                </div>

                <div class="form-group" data-admin-only>
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="Pending">Pending</option>
                        <option value="Verified">Verified</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <button type="submit" class="btn">Record Donation</button>
            </form>
        </div>

        <!-- Table Section -->
        <div class="card">
            <h3>Donation Transactions</h3>
            <table>
                <thead>
                    <tr>
                        <th>Donation No.</th>
                        <th>Donor</th>
                        <th>Campaign</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="records-table"></tbody>
            </table>
        </div>
    </div>

    <script src="api-config.js"></script>
    <script src="app.js" defer></script>
</body>
</html>
