<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset User Password - Donation Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="card login-card">
            <p class="login-kicker">USER ACCOUNT RECOVERY</p>
            <h1>Reset password</h1>
            <p class="login-intro">This recovery changes the regular user account only. Enter the recovery key configured by the administrator.</p>
            <form id="recovery-form">
                <div class="form-group">
                    <label for="recoveryCode">Recovery key</label>
                    <input type="password" id="recoveryCode" name="recoveryCode" autocomplete="off" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="10" maxlength="128" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="10" maxlength="128" required>
                </div>
                <p class="login-error" id="recovery-error" role="alert" aria-live="polite"></p>
                <p class="login-success" id="recovery-success" role="status" aria-live="polite"></p>
                <button type="submit" class="btn login-button">Reset user password</button>
            </form>
            <a class="recovery-link" href="login.html">Back to sign in</a>
        </section>
    </main>
    <script src="api-config.js"></script>
    <script src="forgot-password.js" defer></script>
</body>
</html>
