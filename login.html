<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Donation Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="card login-card">
            <p class="login-kicker">DONATION MANAGEMENT</p>
            <h1>Sign in</h1>
            <p class="login-intro">Access your donation workspace.</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
                <button type="submit" class="btn login-button">Sign in</button>
            </form>
            <a class="recovery-link" href="forgot-password.html">Forgot user password?</a>
        </section>
    </main>
    <script src="api-config.js"></script>
    <script src="login.js" defer></script>
</body>
</html>
